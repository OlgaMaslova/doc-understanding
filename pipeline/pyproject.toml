[project]
name = "docrace-pipeline"
version = "0.1.0"
description = "Offline precompute pipeline for DocRace: six extraction strategies over three documents."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "pyyaml>=6.0",
]

[project.scripts]
docrace-precompute = "docrace.precompute:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
